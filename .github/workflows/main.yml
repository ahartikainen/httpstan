name: httpstan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: httpstan tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install "poetry~=1.8"

      - name: Build libraries used by Stan
        run: make -j2

      # export test dependencies from pyproject.toml, install them
      - name: Install dependencies
        run: |
          poetry export -f requirements.txt --without-hashes --with dev -o requirements.txt \
          && pip install -r requirements.txt

      - name: Check code
        run: scripts/check

      - name: Build and Install wheel
        run: |
          poetry build -f wheel -v
          python -m pip install dist/*.whl

      - name: Run tests
        run: |
          cp -R tests "$RUNNER_TEMP/httpstan-tests"
          cd "$RUNNER_TEMP"
          python -c 'import httpstan, httpstan.empty; print(httpstan.__file__); httpstan.empty.noop()'
          python -m pytest -s -v --asyncio-mode=auto httpstan-tests

      - name: Test PyStan compatibility
        run: |
          cd "$RUNNER_TEMP"
          pip install --pre pystan "$GITHUB_WORKSPACE"/dist/*.whl
          python -c'import stan;assert stan.build("parameters {real y;} model {y ~ normal(0,1);}").sample()["y"] is not None'
