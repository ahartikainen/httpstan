name: httpstan Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.profile }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [official-clang, official-msvc, portable-clang, portable-msvc]
    env:
      HTTPSTAN_ACCEPT_MSVC_LICENSE: 'yes'
      HTTPSTAN_PORTABLE_MSVC_VERSION: ${{ vars.HTTPSTAN_PORTABLE_MSVC_VERSION }}
      HTTPSTAN_PORTABLE_SDK_VERSION: ${{ vars.HTTPSTAN_PORTABLE_SDK_VERSION }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test (${{ matrix.profile }})
        shell: cmd
        run: python -u scripts\windows_ci.py --profile ${{ matrix.profile }} --through full
      - name: Stage summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows-logs/summary.txt) {
            Get-Content windows-logs/summary.txt | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs-${{ matrix.profile }}
          path: windows-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload wheel (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: httpstan-wheel-${{ matrix.profile }}
          path: dist/*.whl
          if-no-files-found: ignore
          retention-days: 14
